<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A little encouragement, one message each day. Open your message and come back tomorrow for another.">
  <title>A Message for Today</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="page">
    <section class="message-card">

      <p class="eyebrow">a little something for you</p>

      <h1>Your message for today</h1>

      <p class="intro">
        One message. One day.
        Come back tomorrow for another.
      </p>

      <button id="messageButton" type="button" aria-controls="messageBox" aria-expanded="false">
        Give me my message
      </button>

      <div id="messageBox" class="message-box hidden">
        <p id="dailyMessage" role="status" aria-live="polite" aria-atomic="true"></p>
      </div>

      <p id="storageNotice" class="storage-notice hidden" role="status">
        Your browser cannot save this message. It will stay the same while this page is open.
      </p>
      <noscript><p class="storage-notice">Please enable JavaScript to open your daily message.</p></noscript>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
